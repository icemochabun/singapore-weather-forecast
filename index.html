<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singapore Weather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --surface:   #ffffff;
      --surface2:  #efefef;
      --surface3:  #cfe2f3;
      --border:    #dde5ef;
      --accent:    #1155cc;
      --accent-lt: #cfe2f3;
      --text:      #000000;
      --muted:     #5a6a80;
      --muted2:    #8fa0b4;
      --radius:    12px;
      --radius-sm: 8px;
    }

    body {
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--accent);
      padding: 28px 24px 22px;
      text-align: center;
      color: #fff;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    header p {
      font-size: 0.82rem;
      opacity: 0.8;
      margin-top: 4px;
      font-weight: 300;
    }
    #last-updated {
      font-size: 0.72rem;
      opacity: 0.65;
      margin-top: 5px;
      font-weight: 300;
    }

    /* Location bar */
    #location-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    #location-info {
      font-size: 0.8rem;
      background: rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 400;
    }
    #location-info .loc-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #7ee8a2;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    #detect-btn {
      font-size: 0.78rem;
      font-family: inherit;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 20px;
      padding: 6px 16px;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: background 0.2s;
    }
    #detect-btn:hover { background: rgba(255,255,255,0.28); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      min-width: 120px;
      padding: 14px 10px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .tab:hover { color: var(--accent); background: var(--accent-lt); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 56px; }

    /* ── Loader ── */
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 300px;
      color: var(--muted);
      font-weight: 300;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    #error-msg {
      background: #fff0f0;
      border: 1.5px solid #f5c6c6;
      border-radius: var(--radius);
      padding: 14px 18px;
      color: #b91c1c;
      margin-bottom: 20px;
      display: none;
      font-size: 0.85rem;
    }

    /* ── Section title (H2 Subhead style) ── */
    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 28px 0 12px;
    }

    /* ── 4-Day Forecast ── */
    .four-day-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .day-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .day-card:hover {
      box-shadow: 0 4px 16px rgba(17,85,204,0.1);
      transform: translateY(-2px);
    }
    .day-card .day-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .day-card .day-date {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text);
    }
    .day-card .day-icon {
      font-size: 2.8rem;
      margin: 14px 0 10px;
      display: block;
    }
    .day-card .day-forecast {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .day-card .day-summary {
      font-size: 0.77rem;
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.5;
      font-style: italic;
    }
    .day-stats {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; }
    .stat-label { color: var(--muted); font-weight: 300; }
    .stat-value { font-weight: 700; }
    .temp-range    { color: var(--accent); }
    .humidity-range{ color: #0ea5e9; }
    .wind-info     { color: var(--muted); }

    /* ── General 24-hr summary ── */
    .general-summary {
      background: var(--accent-lt);
      border: 1.5px solid #b3cfea;
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
    }
    .general-icon { font-size: 3rem; }
    .general-info { flex: 1; min-width: 200px; }
    .general-forecast { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .general-valid { font-size: 0.78rem; font-weight: 300; color: var(--muted); margin-top: 3px; }
    .general-meta { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
    .general-meta span { font-size: 0.82rem; color: var(--muted); font-weight: 300; }
    .general-meta strong { color: var(--text); font-weight: 700; }

    /* ── 24-Hour Regional cards ── */
    .region-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 12px;
    }
    .region-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .region-card:hover { box-shadow: 0 4px 16px rgba(17,85,204,0.08); }
    .region-card.my-region {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-lt);
    }
    .region-header {
      padding: 11px 14px;
      font-weight: 700;
      font-size: 0.88rem;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .region-card.my-region .region-header { background: var(--accent); }
    .region-header .you-badge {
      margin-left: auto;
      font-size: 0.6rem;
      background: #fff;
      color: var(--accent);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .region-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .period-rows { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .period-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
    }
    .period-time { color: var(--muted2); font-size: 0.7rem; font-weight: 300; }
    .period-main { display: flex; align-items: center; gap: 7px; }
    .period-icon { font-size: 1.1rem; flex-shrink: 0; }
    .period-text { color: var(--text); font-weight: 700; font-size: 0.8rem; line-height: 1.35; }

    /* ── 2-Hour ── */
    .two-hr-controls {
      display: flex;
      gap: 10px;
      align-items: stretch;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .two-hr-valid {
      background: var(--accent-lt);
      border: 1.5px solid #b3cfea;
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--muted);
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
    }
    .two-hr-valid strong { color: var(--accent); font-weight: 700; }

    /* Dropdown */
    .dropdown-wrap { position: relative; }
    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 16px;
      font-size: 0.83rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s, background 0.2s;
      min-width: 170px;
    }
    .dropdown-toggle:hover { border-color: var(--accent); background: var(--accent-lt); }
    .dropdown-toggle .arrow { margin-left: auto; color: var(--muted2); font-size: 0.65rem; transition: transform 0.2s; }
    .dropdown-toggle.open { border-color: var(--accent); background: var(--accent-lt); }
    .dropdown-toggle.open .arrow { transform: rotate(180deg); }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      min-width: 230px;
      max-height: 340px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: none;
    }
    .dropdown-menu.open { display: block; }

    .dd-search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .dd-search {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }
    .dd-search::placeholder { color: var(--muted2); }
    .dd-search:focus { border-color: var(--accent); }

    .dd-all-option {
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      color: var(--accent);
    }
    .dd-all-option:hover { background: var(--accent-lt); }

    .dd-group-label {
      padding: 8px 12px 4px;
      font-size: 0.67rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dd-group-label:hover { background: var(--accent-lt); color: var(--accent); }
    .dd-group-label.selected { color: var(--accent); background: var(--accent-lt); }

    .dd-option {
      padding: 8px 14px 8px 26px;
      font-size: 0.82rem;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.15s;
      color: var(--text);
    }
    .dd-option:hover { background: var(--surface2); }
    .dd-option.selected { color: var(--accent); font-weight: 700; background: var(--accent-lt); }
    .dd-option.hidden-opt { display: none; }
    .dd-no-results { padding: 14px; font-size: 0.82rem; color: var(--muted2); text-align: center; font-weight: 300; }

    /* Area sections */
    .area-region-section { margin-bottom: 26px; }
    .area-region-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
      color: var(--text);
    }
    .area-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 8px;
    }
    .area-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 12px 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .area-card:hover { box-shadow: 0 2px 10px rgba(17,85,204,0.08); border-color: #b3cfea; }
    .area-card.my-area {
      border-color: var(--accent);
      background: var(--accent-lt);
    }
    .area-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 1px; }
    .area-name { font-size: 0.8rem; font-weight: 700; line-height: 1.3; color: var(--text); }
    .area-forecast-text { font-size: 0.72rem; font-weight: 300; color: var(--muted); margin-top: 2px; line-height: 1.3; }

    /* Location banner */
    .loc-banner {
      background: var(--accent-lt);
      border: 1.5px solid #b3cfea;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .loc-banner-icon { font-size: 1.8rem; }
    .loc-banner-label { font-size: 0.67rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
    .loc-banner-area  { font-size: 1rem; font-weight: 700; color: var(--text); margin-top: 2px; }
    .loc-banner-region{ font-size: 0.78rem; font-weight: 300; color: var(--muted); }
    .loc-banner-fc    { font-size: 0.85rem; font-weight: 700; color: var(--accent); margin-top: 4px; }

    /* Region color dots (kept distinct) */
    .north-dot   { background: #0ea5e9; }
    .south-dot   { background: #16a34a; }
    .east-dot    { background: #ea580c; }
    .west-dot    { background: #9333ea; }
    .central-dot { background: #ca8a04; }

    /* Refresh button */
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 18px;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
      letter-spacing: 0.02em;
    }
    .refresh-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-lt); }

    /* Today badge */
    .today-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.62rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      vertical-align: middle;
      margin-left: 4px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>&#127961; Singapore Weather</h1>
  <p>Real-time forecasts from data.gov.sg</p>
  <div id="last-updated"></div>
  <div id="location-bar">
    <div id="location-info" style="display:none">
      <div class="loc-dot"></div>
      <span id="location-text"></span>
    </div>
    <button id="detect-btn" onclick="detectLocation()">&#127757; Detect My Location</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="four-day">4-Day Outlook</div>
  <div class="tab" data-tab="twenty-four">24-Hour (Regional)</div>
  <div class="tab" data-tab="two-hr">2-Hour (Areas)</div>
</div>

<main>
  <div id="error-msg"></div>
  <div id="loader"><div class="spinner"></div><span>Loading weather data…</span></div>

  <div id="tab-four-day"    class="tab-content hidden"></div>
  <div id="tab-twenty-four" class="tab-content hidden"></div>
  <div id="tab-two-hr"      class="tab-content hidden"></div>
</main>

<script>
const BASE = 'https://api-open.data.gov.sg/v2/real-time/api';

let userRegion     = null;
let userArea       = null;
let cachedData2    = null;
let selectedFilter = 'all';

// ── Weather icon ──────────────────────────────────────────────────────────────
function weatherIcon(text) {
  if (!text) return '🌡️';
  const t = text.toLowerCase();
  if (t.includes('heavy thundery') && t.includes('gusty')) return '🌪️';
  if (t.includes('heavy thundery')) return '⛈️';
  if (t.includes('thundery'))       return '🌩️';
  if (t.includes('heavy shower') || t.includes('heavy rain')) return '🌧️';
  if (t.includes('passing shower')) return '🌦️';
  if (t.includes('shower'))         return '🌦️';
  if (t.includes('moderate rain'))  return '🌧️';
  if (t.includes('light rain') || t.includes('light shower')) return '🌦️';
  if (t.includes('rain'))           return '🌧️';
  if (t.includes('fog'))            return '🌫️';
  if (t.includes('mist'))           return '🌫️';
  if (t.includes('hazy') || t.includes('haze')) return '😶‍🌫️';
  if (t.includes('windy'))          return '💨';
  if (t.includes('partly cloudy'))  return '⛅';
  if (t.includes('cloudy'))         return '☁️';
  if (t.includes('fair and warm'))  return '🌤️';
  if (t.includes('fair'))           return '☀️';
  return '🌡️';
}

// ── Regions ───────────────────────────────────────────────────────────────────
const REGIONS = {
  north:   { label: 'North',   dotClass: 'north-dot'   },
  south:   { label: 'South',   dotClass: 'south-dot'   },
  east:    { label: 'East',    dotClass: 'east-dot'    },
  west:    { label: 'West',    dotClass: 'west-dot'    },
  central: { label: 'Central', dotClass: 'central-dot' },
};

const REGION_BOUNDS = {
  north:   [1.390, 1.480, 103.670, 103.900],
  south:   [1.220, 1.300, 103.780, 103.900],
  east:    [1.300, 1.420, 103.880, 104.010],
  west:    [1.280, 1.440, 103.620, 103.780],
  central: [1.280, 1.390, 103.780, 103.880],
};

function latLonToRegion(lat, lon) {
  for (const [region, [latMin, latMax, lonMin, lonMax]] of Object.entries(REGION_BOUNDS)) {
    if (lat >= latMin && lat <= latMax && lon >= lonMin && lon <= lonMax) return region;
  }
  return 'central';
}

const AREA_REGION = {
  'Ang Mo Kio':'north','Bishan':'central','Bukit Batok':'west',
  'Bukit Merah':'central','Bukit Panjang':'west','Bukit Timah':'central',
  'Bedok':'east','Boon Lay':'west','Choa Chu Kang':'west',
  'Changi':'east','Clementi':'west','City':'central',
  'Geylang':'east','Hougang':'north','Joo Chiat':'east',
  'Jurong East':'west','Jurong West':'west','Kallang':'central',
  'Lim Chu Kang':'north','Mandai':'north','Marine Parade':'east',
  'Novena':'central','Pasir Ris':'east','Paya Lebar':'east',
  'Punggol':'north','Queenstown':'central','Seletar':'north',
  'Sembawang':'north','Sengkang':'north','Serangoon':'north',
  'Simei':'east','Tampines':'east','Tengah':'west',
  'Toa Payoh':'central','Tuas':'west','Woodlands':'north',
  'Yishun':'north','Queensway':'central','West Coast':'west',
  'Whampoa':'central','Kranji':'north','Buona Vista':'west',
  'Dover':'west','Kent Ridge':'west','Sentosa':'central',
  'Harbourfront':'central','Tanjong Pagar':'central','Chinatown':'central',
  'Clarke Quay':'central','Dhoby Ghaut':'central','Orchard':'central',
  'Newton':'central','Botanic Gardens':'central',
};

function getRegion(area) {
  if (AREA_REGION[area]) return AREA_REGION[area];
  for (const [key, region] of Object.entries(AREA_REGION)) {
    if (area.includes(key) || key.includes(area)) return region;
  }
  return 'central';
}

function nearestArea(lat, lon, areaMetadata) {
  if (!areaMetadata || !areaMetadata.length) return null;
  let best = null, bestDist = Infinity;
  for (const a of areaMetadata) {
    const d = Math.pow(a.label_location.latitude - lat, 2) + Math.pow(a.label_location.longitude - lon, 2);
    if (d < bestDist) { bestDist = d; best = a.name; }
  }
  return best;
}

// ── Geolocation ───────────────────────────────────────────────────────────────
function detectLocation() {
  const btn = document.getElementById('detect-btn');
  btn.textContent = '⏳ Locating…';
  btn.disabled = true;
  if (!navigator.geolocation) { btn.textContent = '📍 Not supported'; btn.disabled = false; return; }

  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    userRegion = latLonToRegion(lat, lon);
    if (cachedData2?.items?.[0]) userArea = nearestArea(lat, lon, cachedData2.area_metadata);

    document.getElementById('location-info').style.display = 'flex';
    document.getElementById('location-text').textContent =
      `${REGIONS[userRegion].label} Region${userArea ? ' · ' + userArea : ''}`;
    btn.textContent = '↺ Re-detect';
    btn.disabled = false;

    if (cachedData2) render2Hr(cachedData2.items, cachedData2.area_metadata);
    highlightMyRegion();
  }, () => {
    btn.textContent = '🌍 Detect My Location';
    btn.disabled = false;
    alert('Location access denied or unavailable.');
  }, { timeout: 10000 });
}

function highlightMyRegion() {
  document.querySelectorAll('.region-card').forEach(c => {
    c.classList.toggle('my-region', c.dataset.region === userRegion);
    const b = c.querySelector('.you-badge');
    if (b) b.style.display = c.dataset.region === userRegion ? '' : 'none';
  });
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchAPI(path) {
  const res = await fetch(BASE + path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.code !== 0) throw new Error(json.errorMsg || 'API error');
  return json.data;
}

// ── Date helpers ──────────────────────────────────────────────────────────────
function toSGT(s) { return new Date(new Date(s).toLocaleString('en-US', { timeZone: 'Asia/Singapore' })); }
function formatDay(s)       { return toSGT(s).toLocaleDateString('en-SG', { weekday: 'long' }); }
function formatShortDate(s) { return toSGT(s).toLocaleDateString('en-SG', { day: 'numeric', month: 'short' }); }
function formatTime(s)      { return toSGT(s).toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', hour12: true }); }
function isToday(s) {
  const d = toSGT(s);
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Singapore' }));
  return d.toDateString() === now.toDateString();
}

// ── Tab switching ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
  });
});

// ── Render: 4-Day ─────────────────────────────────────────────────────────────
function render4Day(records) {
  const el = document.getElementById('tab-four-day');
  if (!records?.length) { el.innerHTML = '<p style="color:var(--muted)">No data available.</p>'; return; }

  const forecasts = records[0].forecasts;
  const updatedAt = records[0].updatedTimestamp;

  let html = `<div class="section-title">4-Day Weather Outlook</div><div class="four-day-grid">`;

  forecasts.forEach(f => {
    const icon = weatherIcon(f.forecast?.text);
    const dayLabel = f.day || formatDay(f.timestamp);
    const dateLabel = formatShortDate(f.timestamp);
    const todayBadge = isToday(f.timestamp) ? '<span class="today-badge">Today</span>' : '';

    html += `
      <div class="day-card">
        <div class="day-name">${dayLabel}${todayBadge}</div>
        <div class="day-date">${dateLabel}</div>
        <span class="day-icon">${icon}</span>
        <div class="day-forecast">${f.forecast?.text || '—'}</div>
        ${f.forecast?.summary ? `<div class="day-summary">${f.forecast.summary}</div>` : ''}
        <div class="day-stats">
          <div class="stat-row"><span class="stat-label">🌡️ Temperature</span><span class="stat-value temp-range">${f.temperature?.low ?? '—'}° – ${f.temperature?.high ?? '—'}°C</span></div>
          <div class="stat-row"><span class="stat-label">💧 Humidity</span><span class="stat-value humidity-range">${f.relativeHumidity?.low ?? '—'} – ${f.relativeHumidity?.high ?? '—'}%</span></div>
          <div class="stat-row"><span class="stat-label">💨 Wind</span><span class="stat-value wind-info">${f.wind?.direction ?? '—'} ${f.wind?.speed?.low ?? '—'}–${f.wind?.speed?.high ?? '—'} km/h</span></div>
        </div>
      </div>`;
  });

  html += `</div>`;
  if (updatedAt) html += `<button class="refresh-btn" onclick="loadAll()">&#8635;&ensp;Refresh</button><p style="font-size:0.73rem;color:var(--muted2);margin-top:8px;font-weight:300">Data updated: ${formatTime(updatedAt)} SGT</p>`;
  el.innerHTML = html;
}

// ── Render: 24-Hour ───────────────────────────────────────────────────────────
function render24Hr(records) {
  const el = document.getElementById('tab-twenty-four');
  if (!records?.length) { el.innerHTML = '<p style="color:var(--muted)">No data available.</p>'; return; }

  const latest  = records[0];
  const general = latest.general;
  const periods = latest.periods || [];

  let html = `<div class="section-title">General 24-Hour Overview</div>`;

  if (general) {
    const gIcon = weatherIcon(general.forecast?.text);
    html += `
      <div class="general-summary">
        <div class="general-icon">${gIcon}</div>
        <div class="general-info">
          <div class="general-forecast">${general.forecast?.text || '—'}</div>
          <div class="general-valid">${general.validPeriod?.text || ''}</div>
          <div class="general-meta">
            <span>🌡️ <strong>${general.temperature?.low ?? '—'}° – ${general.temperature?.high ?? '—'}°C</strong></span>
            <span>💧 <strong>${general.relativeHumidity?.low ?? '—'} – ${general.relativeHumidity?.high ?? '—'}%</strong></span>
            <span>💨 <strong>${general.wind?.direction ?? '—'} ${general.wind?.speed?.low ?? '—'}–${general.wind?.speed?.high ?? '—'} km/h</strong></span>
          </div>
        </div>
      </div>`;
  }

  html += `<div class="section-title">Regional Forecast by Time Period</div><div class="region-grid">`;

  for (const [key, cfg] of Object.entries(REGIONS)) {
    const isMe = userRegion === key;
    html += `
      <div class="region-card${isMe ? ' my-region' : ''}" data-region="${key}">
        <div class="region-header">
          <div class="region-dot ${cfg.dotClass}"></div>
          ${cfg.label}
          <span class="you-badge" style="${isMe ? '' : 'display:none'}">You</span>
        </div>
        <div class="period-rows">`;

    periods.forEach(p => {
      const region = p.regions?.[key];
      const icon = weatherIcon(region?.text);
      html += `
        <div class="period-row">
          <div class="period-time">${p.timePeriod?.text || ''}</div>
          <div class="period-main">
            <span class="period-icon">${icon}</span>
            <span class="period-text">${region?.text || '—'}</span>
          </div>
        </div>`;
    });

    html += `</div></div>`;
  }

  html += `</div><button class="refresh-btn" onclick="loadAll()">&#8635;&ensp;Refresh</button>`;
  el.innerHTML = html;
}

// ── Render: 2-Hour ────────────────────────────────────────────────────────────
function render2Hr(items, areaMetadata) {
  const el = document.getElementById('tab-two-hr');
  if (!items?.length) { el.innerHTML = '<p style="color:var(--muted)">No data available.</p>'; return; }

  const latest     = items[0];
  const forecasts  = latest.forecasts || [];
  const validPeriod = latest.valid_period;

  const byRegion = { north:[], south:[], east:[], west:[], central:[] };
  forecasts.forEach(f => { (byRegion[getRegion(f.area)] || byRegion.central).push(f); });
  for (const r of Object.keys(byRegion)) byRegion[r].sort((a,b) => a.area.localeCompare(b.area));

  const filterVal = selectedFilter;

  // Build dropdown
  let ddOptions = '';
  for (const [key, cfg] of Object.entries(REGIONS)) {
    const areas = byRegion[key];
    if (!areas.length) continue;
    const rSel = filterVal === `region:${key}` ? ' selected' : '';
    ddOptions += `<div class="dd-group-label dd-region-opt${rSel}" data-group="${key}" onclick="selectFilter('region:${key}')">
      <span class="region-dot ${cfg.dotClass}" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span>
      ${cfg.label} Region
    </div>`;
    areas.forEach(f => {
      const esc = f.area.replace(/'/g, "\\'");
      const sel = filterVal === f.area ? ' selected' : '';
      ddOptions += `<div class="dd-option${sel}" data-area="${f.area}" data-region="${key}" onclick="selectFilter('${esc}')">${f.area}</div>`;
    });
  }

  let html = `
    <div class="two-hr-controls">
      <div class="two-hr-valid">
        Valid: <strong>${validPeriod?.text || '—'}</strong>
      </div>
      <div class="dropdown-wrap" id="dd-wrap">
        <div class="dropdown-toggle" id="dd-toggle" onclick="toggleDropdown()">
          <span id="dd-label">${buildDropdownLabel(filterVal)}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="dropdown-menu" id="dd-menu">
          <div class="dd-search-wrap">
            <input class="dd-search" id="dd-search" placeholder="Search area or region…" oninput="filterDropdown(this.value)" autocomplete="off" />
          </div>
          <div class="dd-all-option" onclick="selectFilter('all')">&#127758; All Regions</div>
          <div id="dd-options">${ddOptions}</div>
        </div>
      </div>
    </div>`;

  // Your location banner
  if (userRegion) {
    const myFC = userArea ? forecasts.find(f => f.area === userArea) : null;
    html += `
      <div class="loc-banner">
        <div class="loc-banner-icon">${myFC ? weatherIcon(myFC.forecast) : '📍'}</div>
        <div>
          <div class="loc-banner-label">Your Location</div>
          <div class="loc-banner-area">${userArea || REGIONS[userRegion].label + ' Region'}</div>
          <div class="loc-banner-region">${REGIONS[userRegion].label} Region</div>
          ${myFC ? `<div class="loc-banner-fc">${myFC.forecast}</div>` : ''}
        </div>
      </div>`;
  }

  // Area sections
  const isAreaFilter   = !filterVal.startsWith('region:') && filterVal !== 'all';
  const regionFilter   = filterVal.startsWith('region:') ? filterVal.replace('region:', '') : null;

  for (const [key, cfg] of Object.entries(REGIONS)) {
    let areas = byRegion[key];
    if (!areas.length) continue;
    if (isAreaFilter) { areas = areas.filter(f => f.area === filterVal); if (!areas.length) continue; }
    else if (regionFilter && regionFilter !== key) continue;

    const count = filterVal === 'all' ? byRegion[key].length : areas.length;

    html += `
      <div class="area-region-section">
        <div class="area-region-title">
          <div class="region-dot ${cfg.dotClass}"></div>
          ${cfg.label} Region
          <span style="font-size:0.73rem;font-weight:300;color:var(--muted2);margin-left:2px">${count} area${count !== 1 ? 's' : ''}</span>
        </div>
        <div class="area-grid">`;

    areas.forEach(f => {
      const isMe = userArea === f.area;
      html += `
        <div class="area-card${isMe ? ' my-area' : ''}">
          <div class="area-icon">${weatherIcon(f.forecast)}</div>
          <div>
            <div class="area-name">${f.area}${isMe ? '&ensp;<span style="color:var(--accent);font-size:0.62rem;font-weight:700">● You</span>' : ''}</div>
            <div class="area-forecast-text">${f.forecast}</div>
          </div>
        </div>`;
    });

    html += `</div></div>`;
  }

  html += `<button class="refresh-btn" onclick="loadAll()">&#8635;&ensp;Refresh</button>`;
  el.innerHTML = html;
  document.addEventListener('click', outsideClickHandler);
}

// ── Dropdown helpers ──────────────────────────────────────────────────────────
function buildDropdownLabel(val) {
  if (val === 'all') return '&#127758; All Regions';
  if (val.startsWith('region:')) {
    const r = val.replace('region:', '');
    return REGIONS[r] ? REGIONS[r].label + ' Region' : 'All Regions';
  }
  return '📍 ' + val;
}

function toggleDropdown() {
  const menu = document.getElementById('dd-menu');
  const toggle = document.getElementById('dd-toggle');
  if (!menu || !toggle) return;
  const isOpen = menu.classList.toggle('open');
  toggle.classList.toggle('open', isOpen);
  if (isOpen) { const s = document.getElementById('dd-search'); if (s) { s.value = ''; filterDropdown(''); s.focus(); } }
}

function outsideClickHandler(e) {
  const wrap = document.getElementById('dd-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('dd-menu')?.classList.remove('open');
    document.getElementById('dd-toggle')?.classList.remove('open');
    document.removeEventListener('click', outsideClickHandler);
  }
}

function filterDropdown(query) {
  const q = query.toLowerCase();
  document.getElementById('dd-no-results')?.remove();
  let anyVisible = false;
  const visibleGroups = new Set();

  document.querySelectorAll('#dd-options .dd-option').forEach(opt => {
    const m = opt.dataset.area.toLowerCase().includes(q);
    opt.classList.toggle('hidden-opt', !m);
    if (m) { anyVisible = true; visibleGroups.add(opt.dataset.region); }
  });

  document.querySelectorAll('#dd-options .dd-group-label').forEach(g => {
    const gm = g.textContent.toLowerCase().includes(q);
    g.style.display = (visibleGroups.has(g.dataset.group) || gm || !q) ? '' : 'none';
  });

  if (!anyVisible && q) {
    const div = Object.assign(document.createElement('div'), { id: 'dd-no-results', className: 'dd-no-results', textContent: 'No areas found' });
    document.getElementById('dd-options').appendChild(div);
  }
}

function selectFilter(val) {
  selectedFilter = val;
  const labelEl = document.getElementById('dd-label');
  if (labelEl) labelEl.innerHTML = buildDropdownLabel(val);
  document.getElementById('dd-menu')?.classList.remove('open');
  document.getElementById('dd-toggle')?.classList.remove('open');
  document.removeEventListener('click', outsideClickHandler);
  if (cachedData2) render2Hr(cachedData2.items, cachedData2.area_metadata);
}

// ── Main loader ───────────────────────────────────────────────────────────────
async function loadAll() {
  const loader = document.getElementById('loader');
  const errEl  = document.getElementById('error-msg');
  errEl.style.display = 'none';
  loader.classList.remove('hidden');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));

  try {
    const [data4, data24, data2] = await Promise.all([
      fetchAPI('/four-day-outlook'),
      fetchAPI('/twenty-four-hr-forecast'),
      fetchAPI('/two-hr-forecast'),
    ]);

    cachedData2 = data2;
    render4Day(data4.records);
    render24Hr(data24.records);
    render2Hr(data2.items, data2.area_metadata);

    document.getElementById('last-updated').textContent =
      'Last fetched: ' + new Date().toLocaleTimeString('en-SG', { timeZone:'Asia/Singapore', hour:'2-digit', minute:'2-digit', second:'2-digit' }) + ' SGT';

    document.getElementById('tab-' + document.querySelector('.tab.active').dataset.tab).classList.remove('hidden');

  } catch (err) {
    errEl.textContent = 'Failed to load weather data: ' + err.message;
    errEl.style.display = 'block';
    console.error(err);
  } finally {
    loader.classList.add('hidden');
  }
}

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
