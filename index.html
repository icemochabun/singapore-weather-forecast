<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singapore Weather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #263347;
      --border: #334155;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --rain: #60a5fa;
      --fair: #fbbf24;
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      padding: 24px 24px 18px;
      text-align: center;
    }
    header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    #last-updated { font-size: 0.75rem; opacity: 0.7; margin-top: 5px; }

    /* Location bar */
    #location-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    #location-info {
      font-size: 0.82rem;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #location-info .loc-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #detect-btn {
      font-size: 0.78rem;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 5px 14px;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    #detect-btn:hover { background: rgba(255,255,255,0.3); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      min-width: 120px;
      padding: 14px 10px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text); background: var(--surface2); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

    /* ── Loader ── */
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 300px;
      color: var(--muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    #error-msg {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: var(--radius);
      padding: 16px 20px;
      color: #fca5a5;
      margin-bottom: 20px;
      display: none;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 24px 0 12px;
    }

    /* ── Your Location Banner ── */
    #your-location-banner {
      background: linear-gradient(90deg, #0f3460 0%, #1a1a4e 100%);
      border: 1px solid #3b4f8a;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 6px;
      display: none;
      align-items: center;
      gap: 14px;
    }
    #your-location-banner .loc-icon { font-size: 1.8rem; }
    #your-location-banner .loc-body { flex: 1; }
    #your-location-banner .loc-label { font-size: 0.7rem; color: #93c5fd; text-transform: uppercase; letter-spacing: 0.06em; }
    #your-location-banner .loc-area  { font-size: 1rem; font-weight: 700; }
    #your-location-banner .loc-region { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    #your-location-banner .loc-forecast { font-size: 0.85rem; color: #bfdbfe; margin-top: 6px; }

    /* ── 4-Day ── */
    .four-day-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }
    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      transition: transform 0.15s;
    }
    .day-card:hover { transform: translateY(-2px); }
    .day-card .day-name { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .day-card .day-date { font-size: 1rem; font-weight: 700; margin-top: 2px; }
    .day-card .day-icon { font-size: 2.6rem; margin: 12px 0 8px; }
    .day-card .day-forecast { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
    .day-card .day-summary  { font-size: 0.78rem; color: var(--accent2); margin-bottom: 12px; font-style: italic; line-height: 1.4; }
    .day-stats { display: flex; flex-direction: column; gap: 6px; }
    .stat-row  { display: flex; justify-content: space-between; align-items: center; font-size: 0.79rem; }
    .stat-label { color: var(--muted); }
    .stat-value { font-weight: 600; }
    .temp-range { color: var(--fair); }
    .humidity-range { color: var(--rain); }
    .wind-info { color: var(--muted); }

    /* ── 24-Hour Regional ── */
    .region-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }
    .region-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .region-card.my-region {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56,189,248,0.25);
    }
    .region-header {
      padding: 11px 14px 9px;
      font-weight: 700;
      font-size: 0.9rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .region-header .you-badge {
      margin-left: auto;
      font-size: 0.62rem;
      background: var(--accent);
      color: #0f172a;
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .region-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .period-rows { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
    .period-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .period-time { color: var(--muted); font-size: 0.72rem; }
    .period-main { display: flex; align-items: center; gap: 7px; }
    .period-icon { font-size: 1.15rem; flex-shrink: 0; }
    .period-text { color: var(--text); font-weight: 500; line-height: 1.35; }

    /* General 24hr */
    .general-summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }
    .general-icon { font-size: 3rem; }
    .general-info { flex: 1; min-width: 200px; }
    .general-forecast { font-size: 1.1rem; font-weight: 600; }
    .general-meta { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; }
    .general-meta span { font-size: 0.82rem; color: var(--muted); }
    .general-meta strong { color: var(--text); }

    /* ── 2-Hour ── */
    /* Search / filter bar */
    .two-hr-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .two-hr-valid {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 16px;
      font-size: 0.85rem;
      color: var(--muted);
      flex: 1;
      min-width: 200px;
    }
    .two-hr-valid strong { color: var(--accent); }

    /* Custom dropdown */
    .dropdown-wrap {
      position: relative;
    }
    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.83rem;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s;
      min-width: 160px;
    }
    .dropdown-toggle:hover { border-color: var(--accent); }
    .dropdown-toggle .arrow { margin-left: auto; color: var(--muted); font-size: 0.7rem; transition: transform 0.2s; }
    .dropdown-toggle.open .arrow { transform: rotate(180deg); }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 220px;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      overflow: hidden;
      display: none;
    }
    .dropdown-menu.open { display: block; }

    .dd-search-wrap {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .dd-search {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 0.82rem;
      color: var(--text);
      outline: none;
    }
    .dd-search::placeholder { color: var(--muted); }
    .dd-search:focus { border-color: var(--accent); }

    .dd-group-label {
      padding: 8px 12px 4px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dd-group-label:hover { background: var(--surface2); color: var(--text); }
    .dd-group-label.selected { color: var(--accent); }
    .dd-option {
      padding: 8px 14px 8px 24px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dd-option:hover { background: var(--surface2); }
    .dd-option.selected { color: var(--accent); font-weight: 600; }
    .dd-option.hidden-opt { display: none; }

    .dd-all-option {
      padding: 9px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      color: var(--accent);
      font-weight: 500;
    }
    .dd-all-option:hover { background: var(--surface2); }
    .dd-no-results { padding: 12px 14px; font-size: 0.82rem; color: var(--muted); text-align: center; }

    .area-region-section { margin-bottom: 24px; }
    .area-region-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .area-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 8px;
    }
    .area-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 12px 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .area-card.my-area {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56,189,248,0.2);
    }
    .area-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; }
    .area-name { font-size: 0.8rem; font-weight: 600; line-height: 1.3; }
    .area-forecast-text { font-size: 0.72rem; color: var(--muted); margin-top: 2px; line-height: 1.3; }

    /* Region color dots */
    .north-dot   { background: #22d3ee; }
    .south-dot   { background: #a3e635; }
    .east-dot    { background: #fb923c; }
    .west-dot    { background: #e879f9; }
    .central-dot { background: #fbbf24; }

    /* Refresh */
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--accent); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>&#127961; Singapore Weather</h1>
  <p>Real-time forecasts from data.gov.sg</p>
  <div id="last-updated"></div>
  <div id="location-bar">
    <div id="location-info" style="display:none">
      <div class="loc-dot"></div>
      <span id="location-text"></span>
    </div>
    <button id="detect-btn" onclick="detectLocation()">&#127757; Detect My Location</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="four-day">4-Day Outlook</div>
  <div class="tab" data-tab="twenty-four">24-Hour (Regional)</div>
  <div class="tab" data-tab="two-hr">2-Hour (Areas)</div>
</div>

<main>
  <div id="error-msg"></div>
  <div id="loader"><div class="spinner"></div><span>Loading weather data…</span></div>

  <div id="tab-four-day"    class="tab-content hidden"></div>
  <div id="tab-twenty-four" class="tab-content hidden"></div>
  <div id="tab-two-hr"      class="tab-content hidden"></div>
</main>

<script>
const BASE = 'https://api-open.data.gov.sg/v2/real-time/api';

// ── State ─────────────────────────────────────────────────────────────────────
let userRegion  = null;   // 'north' | 'south' | 'east' | 'west' | 'central'
let userArea    = null;   // closest named area string
let cachedData2 = null;   // last 2-hr API payload
let selectedFilter = 'all'; // dropdown filter value

// ── Weather icon ──────────────────────────────────────────────────────────────
function weatherIcon(text) {
  if (!text) return '🌡️';
  const t = text.toLowerCase();
  if (t.includes('heavy thundery') && t.includes('gusty')) return '🌪️';
  if (t.includes('heavy thundery')) return '⛈️';
  if (t.includes('thundery')) return '🌩️';
  if (t.includes('heavy shower') || t.includes('heavy rain')) return '🌧️';
  if (t.includes('shower') || t.includes('passing shower')) return '🌦️';
  if (t.includes('moderate rain')) return '🌧️';
  if (t.includes('light rain') || t.includes('light shower')) return '🌦️';
  if (t.includes('rain')) return '🌧️';
  if (t.includes('fog')) return '🌫️';
  if (t.includes('mist')) return '🌫️';
  if (t.includes('hazy') || t.includes('haze')) return '😶‍🌫️';
  if (t.includes('windy')) return '💨';
  if (t.includes('partly cloudy')) return '⛅';
  if (t.includes('cloudy')) return '☁️';
  if (t.includes('fair and warm')) return '🌤️';
  if (t.includes('fair')) return '☀️';
  return '🌡️';
}

// ── Region config ─────────────────────────────────────────────────────────────
const REGIONS = {
  north:   { label: 'North',   dotClass: 'north-dot' },
  south:   { label: 'South',   dotClass: 'south-dot' },
  east:    { label: 'East',    dotClass: 'east-dot'  },
  west:    { label: 'West',    dotClass: 'west-dot'  },
  central: { label: 'Central', dotClass: 'central-dot' },
};

// Singapore region bounding boxes [latMin, latMax, lonMin, lonMax]
const REGION_BOUNDS = {
  north:   [1.390, 1.480, 103.670, 103.900],
  south:   [1.220, 1.300, 103.780, 103.900],
  east:    [1.300, 1.420, 103.880, 104.010],
  west:    [1.280, 1.440, 103.620, 103.780],
  central: [1.280, 1.390, 103.780, 103.880],
};

function latLonToRegion(lat, lon) {
  // Check each region; return first match
  for (const [region, [latMin, latMax, lonMin, lonMax]] of Object.entries(REGION_BOUNDS)) {
    if (lat >= latMin && lat <= latMax && lon >= lonMin && lon <= lonMax) return region;
  }
  return 'central'; // fallback
}

// Area → region mapping
const AREA_REGION = {
  'Ang Mo Kio': 'north', 'Bishan': 'central', 'Bukit Batok': 'west',
  'Bukit Merah': 'central', 'Bukit Panjang': 'west', 'Bukit Timah': 'central',
  'Bedok': 'east', 'Boon Lay': 'west', 'Choa Chu Kang': 'west',
  'Changi': 'east', 'Clementi': 'west', 'City': 'central',
  'Geylang': 'east', 'Hougang': 'north', 'Joo Chiat': 'east',
  'Jurong East': 'west', 'Jurong West': 'west', 'Kallang': 'central',
  'Lim Chu Kang': 'north', 'Mandai': 'north', 'Marine Parade': 'east',
  'Novena': 'central', 'Pasir Ris': 'east', 'Paya Lebar': 'east',
  'Punggol': 'north', 'Queenstown': 'central', 'Seletar': 'north',
  'Sembawang': 'north', 'Sengkang': 'north', 'Serangoon': 'north',
  'Simei': 'east', 'Tampines': 'east', 'Tengah': 'west',
  'Toa Payoh': 'central', 'Tuas': 'west', 'Woodlands': 'north',
  'Yishun': 'north', 'Queensway': 'central', 'West Coast': 'west',
  'Whampoa': 'central', 'Kranji': 'north', 'Buona Vista': 'west',
  'Dover': 'west', 'Kent Ridge': 'west', 'Sentosa': 'central',
  'Harbourfront': 'central', 'Tanjong Pagar': 'central', 'Chinatown': 'central',
  'Clarke Quay': 'central', 'Dhoby Ghaut': 'central', 'Orchard': 'central',
  'Newton': 'central', 'Botanic Gardens': 'central',
};

function getRegion(area) {
  if (AREA_REGION[area]) return AREA_REGION[area];
  for (const [key, region] of Object.entries(AREA_REGION)) {
    if (area.includes(key) || key.includes(area)) return region;
  }
  return 'central';
}

// Find nearest area from area_metadata given lat/lon
function nearestArea(lat, lon, areaMetadata) {
  if (!areaMetadata || !areaMetadata.length) return null;
  let best = null, bestDist = Infinity;
  for (const a of areaMetadata) {
    const dlat = a.label_location.latitude - lat;
    const dlon = a.label_location.longitude - lon;
    const d = dlat * dlat + dlon * dlon;
    if (d < bestDist) { bestDist = d; best = a.name; }
  }
  return best;
}

// ── Geolocation ───────────────────────────────────────────────────────────────
function detectLocation() {
  const btn = document.getElementById('detect-btn');
  btn.textContent = '⏳ Locating…';
  btn.disabled = true;

  if (!navigator.geolocation) {
    btn.textContent = '📍 Not supported';
    btn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      userRegion = latLonToRegion(lat, lon);

      // Find nearest named area if we have 2-hr data
      if (cachedData2 && cachedData2.items && cachedData2.items[0]) {
        userArea = nearestArea(lat, lon, cachedData2.area_metadata);
      }

      // Update header badge
      const locInfo = document.getElementById('location-info');
      locInfo.style.display = 'flex';
      document.getElementById('location-text').textContent =
        `${REGIONS[userRegion].label} Region${userArea ? ' · ' + userArea : ''}`;

      btn.textContent = '↺ Re-detect';
      btn.disabled = false;

      // Re-render with location awareness
      if (cachedData2) render2Hr(cachedData2.items, cachedData2.area_metadata);
      rerenderLocationBanner();
      highlightMyRegion();
    },
    err => {
      btn.textContent = '📍 Detect My Location';
      btn.disabled = false;
      alert('Location access denied or unavailable.');
    },
    { timeout: 10000 }
  );
}

function highlightMyRegion() {
  // Highlight the correct card in 24-hr tab
  document.querySelectorAll('.region-card').forEach(card => {
    card.classList.toggle('my-region', card.dataset.region === userRegion);
    const badge = card.querySelector('.you-badge');
    if (badge) badge.style.display = card.dataset.region === userRegion ? '' : 'none';
  });
}

// ── Fetch ──────────────────────────────────────────────────────────────────────
async function fetchAPI(path) {
  const res = await fetch(BASE + path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.code !== 0) throw new Error(json.errorMsg || 'API error');
  return json.data;
}

// ── Date helpers ──────────────────────────────────────────────────────────────
function toSGT(s) {
  return new Date(new Date(s).toLocaleString('en-US', { timeZone: 'Asia/Singapore' }));
}
function formatDay(s) {
  return toSGT(s).toLocaleDateString('en-SG', { weekday: 'long' });
}
function formatShortDate(s) {
  const d = toSGT(s);
  return d.toLocaleDateString('en-SG', { day: 'numeric', month: 'short' });
}
function formatTime(s) {
  return toSGT(s).toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', hour12: true });
}
function isToday(s) {
  const d = toSGT(s);
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Singapore' }));
  return d.toDateString() === now.toDateString();
}

// ── Tab switching ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
  });
});

// ── Render: 4-Day ─────────────────────────────────────────────────────────────
function render4Day(records) {
  const el = document.getElementById('tab-four-day');
  if (!records || !records.length) { el.innerHTML = '<p style="color:var(--muted)">No data.</p>'; return; }

  const forecasts = records[0].forecasts;
  const updatedAt = records[0].updatedTimestamp;

  let html = `<div class="section-title">4-Day Weather Outlook</div><div class="four-day-grid">`;

  forecasts.forEach(f => {
    const icon = weatherIcon(f.forecast?.text);
    const dayLabel = f.day || formatDay(f.timestamp);
    const dateLabel = formatShortDate(f.timestamp);
    const todayBadge = isToday(f.timestamp)
      ? ' <span style="background:#38bdf820;color:var(--accent);font-size:0.65rem;padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase">Today</span>' : '';

    html += `
      <div class="day-card">
        <div class="day-name">${dayLabel}${todayBadge}</div>
        <div class="day-date">${dateLabel}</div>
        <div class="day-icon">${icon}</div>
        <div class="day-forecast">${f.forecast?.text || '—'}</div>
        ${f.forecast?.summary ? `<div class="day-summary">${f.forecast.summary}</div>` : ''}
        <div class="day-stats">
          <div class="stat-row"><span class="stat-label">🌡️ Temp</span><span class="stat-value temp-range">${f.temperature?.low ?? '—'}° – ${f.temperature?.high ?? '—'}°C</span></div>
          <div class="stat-row"><span class="stat-label">💧 Humidity</span><span class="stat-value humidity-range">${f.relativeHumidity?.low ?? '—'} – ${f.relativeHumidity?.high ?? '—'}%</span></div>
          <div class="stat-row"><span class="stat-label">💨 Wind</span><span class="stat-value wind-info">${f.wind?.direction ?? '—'} ${f.wind?.speed?.low ?? '—'}–${f.wind?.speed?.high ?? '—'} km/h</span></div>
        </div>
      </div>`;
  });

  html += `</div>`;
  if (updatedAt) html += `<button class="refresh-btn" onclick="loadAll()">&#8635; Refresh</button><p style="font-size:0.75rem;color:var(--muted);margin-top:8px">Updated: ${formatTime(updatedAt)} SGT</p>`;
  el.innerHTML = html;
}

// ── Render: 24-Hour ───────────────────────────────────────────────────────────
function render24Hr(records) {
  const el = document.getElementById('tab-twenty-four');
  if (!records || !records.length) { el.innerHTML = '<p style="color:var(--muted)">No data.</p>'; return; }

  const latest = records[0];
  const general = latest.general;
  const periods = latest.periods || [];

  let html = `<div class="section-title">General 24-Hour Overview</div>`;

  if (general) {
    const gIcon = weatherIcon(general.forecast?.text);
    html += `
      <div class="general-summary">
        <div class="general-icon">${gIcon}</div>
        <div class="general-info">
          <div class="general-forecast">${general.forecast?.text || '—'}</div>
          <div style="font-size:0.78rem;color:var(--muted);margin-top:4px">${general.validPeriod?.text || ''}</div>
          <div class="general-meta">
            <span>🌡️ <strong>${general.temperature?.low ?? '—'}° – ${general.temperature?.high ?? '—'}°C</strong></span>
            <span>💧 <strong>${general.relativeHumidity?.low ?? '—'} – ${general.relativeHumidity?.high ?? '—'}%</strong></span>
            <span>💨 <strong>${general.wind?.direction ?? '—'} ${general.wind?.speed?.low ?? '—'}–${general.wind?.speed?.high ?? '—'} km/h</strong></span>
          </div>
        </div>
      </div>`;
  }

  html += `<div class="section-title">Regional Forecast by Time Period</div><div class="region-grid">`;

  for (const [key, cfg] of Object.entries(REGIONS)) {
    const isMe = userRegion === key;
    html += `
      <div class="region-card${isMe ? ' my-region' : ''}" data-region="${key}">
        <div class="region-header">
          <div class="region-dot ${cfg.dotClass}"></div>
          ${cfg.label}
          <span class="you-badge" style="${isMe ? '' : 'display:none'}">You</span>
        </div>
        <div class="period-rows">`;

    periods.forEach(p => {
      const region = p.regions?.[key];
      const icon = weatherIcon(region?.text);
      html += `
        <div class="period-row">
          <div class="period-time">${p.timePeriod?.text || ''}</div>
          <div class="period-main">
            <span class="period-icon">${icon}</span>
            <span class="period-text">${region?.text || '—'}</span>
          </div>
        </div>`;
    });

    html += `</div></div>`;
  }

  html += `</div><button class="refresh-btn" onclick="loadAll()">&#8635; Refresh</button>`;
  el.innerHTML = html;
}

// ── Render: 2-Hour ────────────────────────────────────────────────────────────
function render2Hr(items, areaMetadata) {
  const el = document.getElementById('tab-two-hr');
  if (!items || !items.length) { el.innerHTML = '<p style="color:var(--muted)">No data.</p>'; return; }

  const latest = items[0];
  const forecasts = latest.forecasts || [];
  const validPeriod = latest.valid_period;

  // Group by region
  const byRegion = { north: [], south: [], east: [], west: [], central: [] };
  forecasts.forEach(f => {
    const r = getRegion(f.area);
    (byRegion[r] || byRegion.central).push(f);
  });
  for (const r of Object.keys(byRegion)) byRegion[r].sort((a, b) => a.area.localeCompare(b.area));

  const filterVal = selectedFilter;

  // Controls bar
  let ddOptions = '';
  for (const [key, cfg] of Object.entries(REGIONS)) {
    const areas = byRegion[key];
    if (!areas.length) continue;
    const regionSelected = filterVal === `region:${key}` ? ' selected' : '';
    ddOptions += `<div class="dd-group-label dd-region-opt${regionSelected}" data-group="${key}" onclick="selectFilter('region:${key}')">
      <span class="region-dot ${cfg.dotClass}" style="display:inline-block"></span>
      ${cfg.label} Region
    </div>`;
    areas.forEach(f => {
      const esc = f.area.replace(/'/g, "\\'");
      const sel = filterVal === f.area ? ' selected' : '';
      ddOptions += `<div class="dd-option${sel}" data-area="${f.area}" data-region="${key}" onclick="selectFilter('${esc}')">${f.area}</div>`;
    });
  }

  let html = `
    <div class="two-hr-controls">
      <div class="two-hr-valid">
        2-Hour Forecast valid: <strong>${validPeriod?.text || '—'}</strong>
      </div>
      <div class="dropdown-wrap" id="dd-wrap">
        <div class="dropdown-toggle" id="dd-toggle" onclick="toggleDropdown()">
          <span id="dd-label">${buildDropdownLabel(filterVal)}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="dropdown-menu" id="dd-menu">
          <div class="dd-search-wrap">
            <input class="dd-search" id="dd-search" placeholder="Search area or region…" oninput="filterDropdown(this.value)" autocomplete="off" />
          </div>
          <div class="dd-all-option" onclick="selectFilter('all')">&#127758; All Regions</div>
          <div id="dd-options">${ddOptions}</div>
        </div>
      </div>
    </div>`;

  // Location hint
  if (userRegion) {
    const myAreaForecast = userArea ? forecasts.find(f => f.area === userArea) : null;
    html += `
      <div id="your-location-banner" style="display:flex;background:linear-gradient(90deg,#0f3460,#1a1a4e);border:1px solid #3b4f8a;border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;align-items:center;gap:14px">
        <div style="font-size:1.8rem">${myAreaForecast ? weatherIcon(myAreaForecast.forecast) : '📍'}</div>
        <div>
          <div style="font-size:0.7rem;color:#93c5fd;text-transform:uppercase;letter-spacing:0.06em">Your Location</div>
          <div style="font-size:1rem;font-weight:700">${userArea || REGIONS[userRegion].label + ' Region'}</div>
          <div style="font-size:0.8rem;color:var(--muted)">${REGIONS[userRegion].label} Region</div>
          ${myAreaForecast ? `<div style="font-size:0.85rem;color:#bfdbfe;margin-top:4px">${myAreaForecast.forecast}</div>` : ''}
        </div>
      </div>`;
  }

  // Area sections — filtered
  const showAll = filterVal === 'all';
  const isAreaFilter = !filterVal.startsWith('region:') && filterVal !== 'all';
  const regionFilter = filterVal.startsWith('region:') ? filterVal.replace('region:', '') : null;

  for (const [key, cfg] of Object.entries(REGIONS)) {
    let areas = byRegion[key];
    if (!areas.length) continue;

    // Apply filter
    if (isAreaFilter) {
      areas = areas.filter(f => f.area === filterVal);
      if (!areas.length) continue;
    } else if (regionFilter && regionFilter !== key) {
      continue;
    }

    const count = showAll ? byRegion[key].length : areas.length;

    html += `
      <div class="area-region-section">
        <div class="area-region-title">
          <div class="region-dot ${cfg.dotClass}"></div>
          ${cfg.label} Region
          <span style="font-size:0.75rem;font-weight:400;color:var(--muted)">${count} area${count !== 1 ? 's' : ''}</span>
        </div>
        <div class="area-grid">`;

    areas.forEach(f => {
      const isMe = userArea === f.area;
      html += `
        <div class="area-card${isMe ? ' my-area' : ''}">
          <div class="area-icon">${weatherIcon(f.forecast)}</div>
          <div>
            <div class="area-name">${f.area}${isMe ? ' <span style="color:var(--accent);font-size:0.65rem">● You</span>' : ''}</div>
            <div class="area-forecast-text">${f.forecast}</div>
          </div>
        </div>`;
    });

    html += `</div></div>`;
  }

  html += `<button class="refresh-btn" onclick="loadAll()">&#8635; Refresh</button>`;
  el.innerHTML = html;

  // Close dropdown on outside click
  document.addEventListener('click', outsideClickHandler);
}

function buildDropdownLabel(val) {
  if (val === 'all') return '&#127758; All Regions';
  if (val.startsWith('region:')) {
    const r = val.replace('region:', '');
    return REGIONS[r] ? REGIONS[r].label + ' Region' : 'All Regions';
  }
  return '📍 ' + val;
}

// ── Dropdown logic ────────────────────────────────────────────────────────────
function toggleDropdown() {
  const menu = document.getElementById('dd-menu');
  const toggle = document.getElementById('dd-toggle');
  if (!menu || !toggle) return;
  const isOpen = menu.classList.toggle('open');
  toggle.classList.toggle('open', isOpen);
  if (isOpen) {
    const search = document.getElementById('dd-search');
    if (search) { search.value = ''; filterDropdown(''); search.focus(); }
  }
}

function outsideClickHandler(e) {
  const wrap = document.getElementById('dd-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const menu = document.getElementById('dd-menu');
    const toggle = document.getElementById('dd-toggle');
    if (menu) menu.classList.remove('open');
    if (toggle) toggle.classList.remove('open');
    document.removeEventListener('click', outsideClickHandler);
  }
}

function filterDropdown(query) {
  const q = query.toLowerCase();
  const opts   = document.querySelectorAll('#dd-options .dd-option');
  const groups = document.querySelectorAll('#dd-options .dd-group-label');
  const existing = document.getElementById('dd-no-results');
  if (existing) existing.remove();

  let anyVisible = false;
  const visibleGroups = new Set();

  opts.forEach(opt => {
    const matches = opt.dataset.area.toLowerCase().includes(q);
    opt.classList.toggle('hidden-opt', !matches);
    if (matches) { anyVisible = true; visibleGroups.add(opt.dataset.region); }
  });

  groups.forEach(g => {
    // also match group label text against query
    const groupMatch = g.textContent.toLowerCase().includes(q);
    const hasVisibleChild = visibleGroups.has(g.dataset.group);
    g.style.display = (hasVisibleChild || groupMatch || !q) ? '' : 'none';
  });

  if (!anyVisible && q) {
    const div = document.createElement('div');
    div.id = 'dd-no-results';
    div.className = 'dd-no-results';
    div.textContent = 'No areas found';
    document.getElementById('dd-options').appendChild(div);
  }
}

function selectFilter(val) {
  selectedFilter = val;
  const labelEl = document.getElementById('dd-label');
  if (labelEl) labelEl.innerHTML = buildDropdownLabel(val);
  const menu = document.getElementById('dd-menu');
  const toggle = document.getElementById('dd-toggle');
  if (menu) menu.classList.remove('open');
  if (toggle) toggle.classList.remove('open');
  document.removeEventListener('click', outsideClickHandler);

  if (cachedData2) render2Hr(cachedData2.items, cachedData2.area_metadata);
}

// ── Main loader ───────────────────────────────────────────────────────────────
async function loadAll() {
  const loader = document.getElementById('loader');
  const errEl  = document.getElementById('error-msg');
  errEl.style.display = 'none';
  loader.classList.remove('hidden');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));

  try {
    const [data4, data24, data2] = await Promise.all([
      fetchAPI('/four-day-outlook'),
      fetchAPI('/twenty-four-hr-forecast'),
      fetchAPI('/two-hr-forecast'),
    ]);

    cachedData2 = data2;

    // If geolocation was already granted, find nearest area
    if (userRegion && !userArea && data2.area_metadata) {
      // Can't re-derive position without re-requesting, so keep existing
    }

    render4Day(data4.records);
    render24Hr(data24.records);
    render2Hr(data2.items, data2.area_metadata);

    document.getElementById('last-updated').textContent =
      'Last fetched: ' + new Date().toLocaleTimeString('en-SG', { timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' SGT';

    const activeTab = document.querySelector('.tab.active').dataset.tab;
    document.getElementById('tab-' + activeTab).classList.remove('hidden');

  } catch (err) {
    errEl.textContent = 'Failed to load weather data: ' + err.message;
    errEl.style.display = 'block';
    console.error(err);
  } finally {
    loader.classList.add('hidden');
  }
}

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
